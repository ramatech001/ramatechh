<!DOCTYPE html>
<html lang="hi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#6546d7">
	<title>Welcome Back | Login</title>
	<style>
		* { box-sizing: border-box; }

		:root {
			color-scheme: light;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			overflow-x: hidden;
			color: #fff;
			background: linear-gradient(-45deg, #6d4aff, #e34f9b, #ff9a5a, #28bfc4);
			background-size: 400% 400%;
			animation: gradient-shift 20s ease infinite;
		}

		body::before,
		body::after {
			position: fixed;
			z-index: -1;
			content: "";
			width: 280px;
			height: 280px;
			border-radius: 50%;
			background: rgba(255, 255, 255, .18);
			filter: blur(2px);
			animation: float 8s ease-in-out infinite alternate;
		}

		body::before { top: 8%; left: 8%; }
		body::after { right: 7%; bottom: 5%; width: 210px; height: 210px; animation-delay: -3s; }

		@keyframes gradient-shift {
			0% { background-position: 0% 50%; }
			25% { background-position: 50% 100%; }
			50% { background-position: 100% 50%; }
			75% { background-position: 50% 0%; }
			100% { background-position: 0% 50%; }
		}

		@keyframes float {
			from { transform: translateY(0) scale(1); }
			to { transform: translateY(28px) scale(1.08); }
		}

		.login-card {
			width: min(100%, 430px);
			padding: 42px 38px 34px;
			border: 1px solid rgba(255, 255, 255, .42);
			border-radius: 28px;
			background: rgba(255, 255, 255, .19);
			box-shadow: 0 24px 70px rgba(34, 20, 91, .25), inset 0 1px 0 rgba(255,255,255,.35);
			backdrop-filter: blur(18px);
			-webkit-backdrop-filter: blur(18px);
		}

		.brand-mark {
			width: 58px;
			height: 58px;
			margin: 0 auto 18px;
			display: grid;
			place-items: center;
			border: 1px solid rgba(255,255,255,.55);
			border-radius: 19px;
			background: linear-gradient(135deg, rgba(255,255,255,.5), rgba(255,255,255,.12));
			box-shadow: 0 10px 24px rgba(47, 25, 115, .18);
			font-size: 27px;
		}

		h1 { margin: 0; text-align: center; font-size: clamp(1.8rem, 6vw, 2.2rem); letter-spacing: -.04em; }
		.subtitle { margin: 9px 0 30px; text-align: center; color: rgba(255,255,255,.86); font-size: .96rem; }

		.field { margin-bottom: 19px; }
		label { display: block; margin-bottom: 8px; font-size: .88rem; font-weight: 650; }
		.input-wrap { position: relative; }
		.input-wrap span {
			position: absolute;
			top: 50%; left: 15px;
			transform: translateY(-50%);
			opacity: .8;
			pointer-events: none;
		}

		input[type="text"], input[type="password"] {
			width: 100%;
			height: 52px;
			padding: 0 15px 0 45px;
			border: 1px solid rgba(255,255,255,.44);
			border-radius: 14px;
			outline: none;
			background: rgba(255,255,255,.16);
			color: #fff;
			font: inherit;
			transition: background .2s, border-color .2s, box-shadow .2s;
		}

		input::placeholder { color: rgba(255,255,255,.72); }
		input[type="text"]:focus, input[type="password"]:focus {
			border-color: #fff;
			background: rgba(255,255,255,.25);
			box-shadow: 0 0 0 4px rgba(255,255,255,.15);
		}

		.options { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 5px 0 24px; font-size: .86rem; }
		.remember { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
		.remember input { width: 16px; height: 16px; margin: 0; accent-color: #6746dd; }
		a { color: #fff; font-weight: 700; text-decoration: none; }
		a:hover { text-decoration: underline; text-underline-offset: 3px; }

		.submit-button {
			width: 100%;
			min-height: 53px;
			border: 0;
			border-radius: 15px;
			color: #4932a5;
			background: linear-gradient(110deg, #fff 0%, #fff0fb 48%, #fff7cf 100%);
			box-shadow: 0 10px 24px rgba(45, 24, 113, .2);
			font: inherit;
			font-size: 1rem;
			font-weight: 800;
			cursor: pointer;
			transition: transform .2s, box-shadow .2s;
		}

		.submit-button:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(45, 24, 113, .28); }
		.submit-button:active { transform: translateY(0); }
		.signup { margin: 24px 0 0; text-align: center; color: rgba(255,255,255,.85); font-size: .9rem; }
		.signup a { margin-left: 4px; }

		@media (max-width: 480px) {
			body { padding: 16px; }
			.login-card { padding: 34px 24px 28px; border-radius: 24px; }
			.options { font-size: .8rem; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
		}
	</style>
</head>
<body>
	<main class="login-card">
		<div class="brand-mark" aria-hidden="true">✨</div>
		<h1>Welcome Back</h1>
		<p class="subtitle">Apne account mein login karein</p>

		<form action="#" method="post">
			<div class="field">
				<label for="username">Username</label>
				<div class="input-wrap">
					<span aria-hidden="true">👤</span>
					<input id="username" name="username" type="text" placeholder="Type Your User Name" autocomplete="username" required>
				</div>
			</div>

			<div class="field">
				<label for="password">Password</label>
				<div class="input-wrap">
					<span aria-hidden="true">🔒</span>
					<input id="password" name="password" type="password" placeholder="Apna password likhein" autocomplete="current-password" required>
				</div>
			</div>

			<div class="options">
				<label class="remember" for="remember"><input id="remember" name="remember" type="checkbox"> Remember me</label>
				<a href="#forgot-password">Forgot password?</a>
			</div>

			<button class="submit-button" type="submit">Login <span aria-hidden="true">→</span></button>
		</form>

		<p class="signup">Account nahi hai? <a href="#signup">Sign up</a></p>
	</main>
</body>
</html>
