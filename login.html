
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rama Computer Center - Admin Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(110deg, #ff0060, #c13d91);
}

/* Login Box */
.login-container {
    width: 420px;
    min-height: 540px;
    background: #fff3f7;
    padding: 57px 35px 35px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.20);
}

/* Heading */
h1 {
    text-align: center;
    color: #007bff;
    font-size: 28px;
    margin-bottom: 20px;
}

h3 {
    text-align: center;
    color: #000;
    font-size: 18px;
    margin-bottom: 28px;
}

/* Input Fields */
.input-box {
    width: 100%;
    height: 38px;
    padding: 10px;
    margin-bottom: 15px;
    border: none;
    outline: none;
    border-radius: 9px;
    background: #eeeeee;
    font-size: 14px;
}

select {
    width: 100%;
    height: 39px;
    padding: 8px 12px;
    margin-bottom: 24px;
    border: none;
    outline: none;
    border-radius: 9px;
    background: #eeeeee;
    font-size: 14px;
}

/* Remember Me */
.remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    font-size: 14px;
    color: #333;
}

.remember input {
    width: 18px;
    height: 18px;
}

/* Buttons */
button {
    width: 100%;
    height: 39px;
    border: none;
    border-radius: 9px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 10px;
}

.submit-btn {
    background: #087bfa;
}

.submit-btn:hover {
    background: #005dcc;
}

.change-btn {
    background: #ff0055;
}

.change-btn:hover {
    background: #d90048;
}

/* Forgot Password */
.forgot {
    display: block;
    text-align: center;
    margin-top: 8px;
    font-size: 14px;
    color: #007bff;
}

/* Mobile Responsive */
@media (max-width: 480px) {
    .login-container {
        width: 90%;
        padding: 45px 25px 30px;
    }

    h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <h1>Rama Computer Center</h1>

    <h3>Admin Login</h3>

    <form>

        <input
            type="text"
            class="input-box"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            class="input-box"
            placeholder="Enter Password"
            required
        >

        <select required>
            <option value="">Select Branch</option>
            <option>Head Office</option>
            <option>Branch 1</option>
            <option>Branch 2</option>
        </select>

        <div class="remember">
            <input type="checkbox" id="remember">
            <label for="remember">Remember Me</label>
        </div>

        <button type="submit" class="submit-btn">
            Submit
        </button>

        <button type="button" class="change-btn"
        onclick="alert('Change Username & Password')">
            Change Username & Password
        </button>

        <a href="#" class="forgot"
        onclick="alert('Please contact administrator'); return false;">
            Forgot Password?
        </a>

    </form>

</div>

</body>
</html>
